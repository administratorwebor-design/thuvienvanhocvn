<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đọc hiểu truyện dân gian</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.6 system-ui;color:#29382c;background:#f1f4ed}main{max-width:1080px;min-height:95vh;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px}aside{background:white;border-radius:12px;padding:16px}button{font:inherit;cursor:pointer;border:1px solid #cdd8c5;border-radius:8px;padding:10px 14px;background:white;color:#345333}aside button{display:block;width:100%;text-align:left;margin:10px 0}.active,button:hover{background:#e2edd8}article{padding:36px;background:#fffef4;border-radius:14px;box-shadow:0 6px 30px #24332110}h1{font-size:32px;line-height:1.3}nav{display:flex;justify-content:space-between;margin-top:32px}label{display:block;border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px;cursor:pointer}input{margin-right:8px}#feedback{padding:12px;border-radius:8px;background:#e5f1df}small{color:#68775f}@media(max-width:650px){main{display:block;padding:12px}aside{display:none}article{padding:20px}h1{font-size:26px}}</style>
<main><aside><strong>Nội dung bài học</strong><div id="menu"></div></aside><article><small id="position"></small><h1 id="title"></h1><div id="content"></div><nav><button id="prev">← Trước</button><button id="next">Tiếp →</button></nav></article></main>
<script>
const slides=[
{title:'Đọc hiểu truyện dân gian',content:'<p>Qua câu chuyện <strong>Ba lưỡi rìu</strong>, chúng ta cùng tìm hiểu nhân vật, sự việc và bài học của truyện.</p><p>Sau bài học, em có thể kể lại các sự việc chính và giải thích ý nghĩa của lòng trung thực.</p>'},
{title:'Nhân vật và sự việc',content:'<p>Nhân vật chính là người tiều phu. Ông cụ xuất hiện để giúp anh tìm lại chiếc rìu.</p><ol><li>Người tiều phu làm rơi rìu xuống sông.</li><li>Ông cụ đưa lên những chiếc rìu khác nhau.</li><li>Anh chỉ nhận chiếc rìu sắt của mình.</li><li>Lòng trung thực của anh được đền đáp.</li></ol>'},
{title:'Phương thức biểu đạt',content:'<p>Truyện kể lại một chuỗi sự việc có nhân vật và diễn biến. Phương thức biểu đạt chính là <strong>tự sự</strong>.</p><p>Miêu tả và lời thoại có thể giúp câu chuyện sinh động hơn. Khi xác định phương thức chính, hãy xét mục đích nổi bật của toàn văn bản.</p>'},
{title:'Cùng luyện tập',question:'Phương thức biểu đạt chính của truyện Ba lưỡi rìu là gì?',options:['Miêu tả','Tự sự','Nghị luận','Thuyết minh'],correct:1,explanation:'Truyện kể lại các sự việc xảy ra với người tiều phu, vì vậy phương thức chính là tự sự.'},
{title:'Vận dụng',content:'<p>Em nhặt được một chiếc bút đẹp ở sân trường. Em sẽ làm gì để thể hiện lòng trung thực?</p><p>Hãy viết 3–5 câu chia sẻ cách xử lý và lý do lựa chọn của em, sau đó trao đổi với thầy cô.</p><p><strong>Ghi nhớ:</strong> Trung thực là tôn trọng sự thật, không nhận những thứ không thuộc về mình.</p>'}
];let index=0;const $=id=>document.getElementById(id);slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${s.title}`;b.onclick=()=>{index=i;render()};$('menu').append(b)});
function render(){const s=slides[index];$('title').textContent=s.title;$('position').textContent=`Bài học • ${index+1}/${slides.length}`;$('content').innerHTML=s.content||'';[...$('menu').children].forEach((b,i)=>b.classList.toggle('active',i===index));$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;if(s.question){const p=document.createElement('p');p.textContent=s.question;$('content').append(p);s.options.forEach((o,i)=>{const label=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name='answer';radio.value=i;label.append(radio,document.createTextNode(o));$('content').append(label)});const check=document.createElement('button');check.textContent='Kiểm tra';check.onclick=()=>{const selected=document.querySelector('input:checked');if(!selected)return;let f=$('feedback');if(!f){f=document.createElement('p');f.id='feedback';f.setAttribute('role','status');$('content').append(f)}f.textContent=(Number(selected.value)===s.correct?'Đúng! ':'Chưa đúng. ')+s.explanation};$('content').append(check)}}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<slides.length-1){index++;render()}};render();
</script></html>
